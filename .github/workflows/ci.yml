name: CI

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest # aarch64-darwin
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Install devenv
        run: nix profile install nixpkgs#devenv

      - name: Build and test vize
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          devenv shell -- build
          devenv shell -- test

      - name: Verify workflows are up to date
        run: |
          nix build .#workflows
          for f in result/*.yml; do
            filename=$(basename "$f")
            diff -q "$f" ".github/workflows/$filename" || {
              echo "ERROR: .github/workflows/$filename is out of sync with Nix definition"
              echo "Run 'generate-workflows' locally and commit the changes"
              exit 1
            }
          done
